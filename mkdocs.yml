site_name: NatureLM-audio
site_description: Audio-language foundation model for bioacoustics
site_url: https://projects.earthspecies.org/naturelm-audio/

repo_name: earthspecies/NatureLM-audio
repo_url: https://github.com/earthspecies/NatureLM-audio

docs_dir: docs-src
# Build to an untracked directory. mike publishes to the gh-pages branch, so
# nothing needs to be committed; building into the old tracked docs/ swept its
# stale Sphinx dotfiles (.buildinfo, .DS_Store) into the deploy.
site_dir: site

# Flat page.html URLs instead of page/ directories. Keeps relative asset paths
# in raw HTML (audio players, images, video) resolving against the site root,
# and preserves the URLs the previous Sphinx build published.
use_directory_urls: false

# MkDocs copies everything under docs_dir into the site, which would otherwise
# publish the superseded Sphinx tree (~180M of duplicate fonts and old HTML).
# The trailing !.nojekyll re-includes that dotfile, which MkDocs skips by
# default, so GitHub Pages keeps bypassing Jekyll on every build.
exclude_docs: |
  _build/
  _static/
  _templates/
  conf.py
  Makefile
  make.bat
  .DS_Store
  !.nojekyll

# Reachable by direct URL only, not linked from anywhere:
# installation is superseded by usage.md.
not_in_nav: |
  installation.md

nav:
  - Getting Started:
      - Overview: index.md
      - Usage: usage.md
      - Quick Start: quick_start.md
      - Prompting Guide: prompting_guide.md
  - Demos & Examples:
      - Interactive Demo: ui_demo.md
      - Examples: examples.md
      - Case Study: case_studies.md
  - Reference:
      - Datasets: datasets.md
      - Paper: paper.md

theme:
  name: material
  favicon: assets/favicon.svg
  logo: assets/esp-logotype-only-white.png
  font: false
  features:
    - content.code.copy
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to system preference

plugins:
  - search

markdown_extensions:
  - toc:
      title: On this page
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# Versioned deploys via mike. Versions track the docs site itself, starting at
# 1.0 — they are not the NatureLM-audio model version. Which model version a
# given page describes is stated in that page's own "This guide applies to
# NatureLM-audio v1.x" note. Tag and deploy by hand:
#   git tag docs-<version>
#   mike deploy --push --update-aliases <version> latest
extra:
  version:
    provider: mike
    alias: false
