[project]
name = "NatureLM-audio"
version = "1.0.2"
description = "NatureLM-audio: an Audio-Language Foundation Model for Bioacoustics"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "torch>=2.6.0,<2.7", # 📌 2.6.0 fixes CVE-2025-32434 (torch.load RCE)
  "torchaudio>=2.6.0,<2.7",
  "torchvision>=0.21.0,<0.22",
  "transformers[sentencepiece]>=4.44.2",
  "datasets>=2.20.0",
  "cloudpathlib[gs]>=0.20.0",
  "einops>=0.8.0",
  "gradio>=5.10.0",
  "google-cloud-aiplatform>=1.76.0",
  "Levenshtein>=0.25.1",
  "librosa>=0.11.0,<1.0",
  "memoization>=0.4.0",
  "mir-eval>=0.7",
  "numpy>=1.26.4",
  "pandas>=1.4.3",
  "peft>=0.11.1",
  "plumbum>=1.7.2",
  "pydantic-settings>=2.7.1",
  "pydantic>=2.7.4",
  "pydub>=0.25.1",
  "pyyaml>=6.0",
  "resampy>=0.4.3",
  "scipy>=1.14.0",
  "soundfile>=0.12.1",
  "tensorboard>=2.18.0",
  "tensorboardX>=2.6.2.2",
  "tqdm>=4.66.4",
  "wandb>=0.17.3",
  "click>=8.1.7",
  "beans-zero",
]

[project.urls]
Homepage = "https://earthspecies.github.io/naturelm-audio-demo/"
Repository = "https://github.com/earthspecies/NatureLM-audio"

[dependency-groups]
gpu = [
  "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1+cu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "bitsandbytes>=0.45.0",
]
dev = [
  "pre-commit>=4.0.1",
  "pytest>=7.1.2",
  "ruff>=0.8.1",
  "matplotlib>=3.9.0",
  "mike>=2.1.3",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["NatureLM"]

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
naturelm = "cli:naturelm"
beans = "cli:beans_zero"

[[tool.uv.dependency-metadata]]
# PyTorch's index serves wheels whose metadata differ by platform: the Linux
# aarch64 torch+cu126 wheel declares no nvidia-*/triton dependencies, and uv's
# universal resolver reads a single wheel's metadata per version. Without this
# override the lock silently drops the whole CUDA runtime for Linux x86_64.
# Copied verbatim from the cp310 manylinux_2_28_x86_64 wheel's METADATA.
name = "torch"
version = "2.6.0+cu126"
requires-python = ">=3.9.0"
requires-dist = [
  "filelock",
  "typing-extensions>=4.10.0",
  "setuptools; python_version >= '3.12'",
  "sympy==1.13.1; python_version >= '3.9'",
  "networkx",
  "jinja2",
  "fsspec",
  "nvidia-cuda-nvrtc-cu12==12.6.77; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-runtime-cu12==12.6.77; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cuda-cupti-cu12==12.6.80; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12==9.5.1.17; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cublas-cu12==12.6.4.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cufft-cu12==11.3.0.4; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-curand-cu12==10.3.7.77; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cusolver-cu12==11.7.1.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cusparse-cu12==12.5.4.2; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-cusparselt-cu12==0.6.3; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-nccl-cu12==2.21.5; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-nvtx-cu12==12.6.77; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "nvidia-nvjitlink-cu12==12.6.85; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "triton==3.2.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "optree>=0.13.0; extra == 'optree'",
  "opt-einsum>=3.3; extra == 'opt-einsum'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
  { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
  { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
  { index = "pytorch-cu126", marker = "platform_system == 'Linux'" },
]
beans-zero = { git = "https://git@github.com/earthspecies/beans-zero.git" }

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or McCabe
# complexity (`C901`) by default.
select = [
  "E4",
  "E7",
  "E9",
  "F", # Flake8
  "I", # isort
]
